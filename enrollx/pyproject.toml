[project]
name = "enrollx-backend"
version = "0.1.0"
description = "Enrollment system of action backend powering the enrollx product"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.28",
    # Pinned to the 15.x line: app/api/stripe_webhook.py::_as_plain_dict
    # reasons explicitly about stripe>=15 semantics (StripeObject is no
    # longer a dict subclass and has no .get()), so 12-14 would be wrong at
    # runtime and a future major could change it again.
    "stripe>=15,<16",
]

[project.optional-dependencies]
# httpx2 is required (not just recommended) by Starlette 1.3.1's testclient
# module: it imports httpx2 and, when only plain httpx is present, emits
# StarletteDeprecationWarning on every TestClient use ("Using `httpx` with
# `starlette.testclient` is deprecated; install `httpx2` instead" —
# starlette/testclient.py:33,36,48). admindash gets httpx2 transitively via
# pydantic-ai -> genai-prices; enrollx has no pydantic-ai, so it is declared
# directly here rather than relying on an unrelated dependency to supply it.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "httpx>=0.28",
    "httpx2>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]
