# Fly.io configuration for familyhub-api
#
# Public customer-facing service. Fronted by Cloudflare at
# https://api.familyhub.floatify.com. Cloudflare IP allowlist middleware
# enforces origin protection. FamilyHub deliberately has no staff auth
# surface — see CLAUDE.md.
#
# Production env vars (set via `flyctl secrets set -a familyhub-api`):
#   - FAMILYHUB_ENVIRONMENT=production
#   - FAMILYHUB_CORS_ALLOWED_ORIGINS=https://familyhub.floatify.com
#   - FAMILYHUB_DATACORE_URL=http://datacore.flycast:5800
#   - FAMILYHUB_APEXFLOW_URL=http://apexflow-api.flycast:5910
#   - FAMILYHUB_APEXFLOW_INTERNAL_KEY=<32+ chars> — MUST EQUAL apexflow-api's
#     APEXFLOW_INTERNAL_KEY exactly. This is the only auth on familyhub's
#     calls into apexflow-backend's token-scoped internal API
#     (app/config.py's validate_production_secrets).
# NEVER set TRUST_ALL_IPS=1 here — production boot refuses it
# (config.py's validate_production_secrets), and it would also disable the
# Cloudflare IP allowlist above and collapse rate-limit keying.
# Note: env vars above are read with the FAMILYHUB_ prefix by pydantic-settings
# (app/config.py's env_prefix="FAMILYHUB_") — an unprefixed ENVIRONMENT or
# CORS_ALLOWED_ORIGINS is silently ignored, not a fallback.

app = "familyhub-api"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "5630"

[http_service]
  internal_port = 5630
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
