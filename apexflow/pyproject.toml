[project]
name = "apexflow-backend"
version = "0.1.0"
description = "Generic workflow engine backend, generalized from enrollx-backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.28",
    # Chat workflow builder (Plan 4). The floor is >=2.0, NOT admindash's
    # inherited >=0.0.30: app/chat/ uses 2.x-only APIs (Agent(..., tools=...)
    # with RunContext-typed deps, agent.run_stream's event/tool-call parts,
    # and the "anthropic:<model>" provider-prefixed model string), none of
    # which a 0.0.x resolution provides. The old floor was satisfiable by a
    # release that cannot import this package, so it documented a
    # compatibility this code never had. The lock already resolves 2.30.0, so
    # raising the floor changes nothing about what installs — it just stops
    # advertising a version range that would fail at import.
    "pydantic-ai>=2.0",
]

[project.optional-dependencies]
# httpx2 is required (not just recommended) by Starlette 1.3.1's testclient
# module: it imports httpx2 and, when only plain httpx is present, emits
# StarletteDeprecationWarning on every TestClient use ("Using `httpx` with
# `starlette.testclient` is deprecated; install `httpx2` instead" —
# starlette/testclient.py:33,36,48). Ported from enrollx/pyproject.toml,
# which carries the same comment for the same reason.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "httpx>=0.28",
    "httpx2>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]
